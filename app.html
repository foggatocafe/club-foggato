<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Foggato - Tarjeta de Fidelidad</title>
    <style>
        /* ==========================================================================
           1. TUS ESTILOS VISUALES (La Piel de Foggato)
           ========================================================================== */
        /* Copia aquí todo tu CSS: colores oscuros, fuentes, la rejilla de los sellos,
           los modales elegantes y la navegación inferior. */
        
        /* Asegúrate de mantener tus diseños CSS para los sellos especiales: */
        .stamp.special-5 { /* Tu diseño de espresso */ }
        .stamp.special-10 { /* Tu diseño de affogato */ }
        
        /* 💡 MEJORA DE ACCESIBILIDAD: Ajustamos el contraste de textos finos */
        .fine, .micro, p { color: rgba(245, 231, 208, 0.7); }

        /* 💡 ESTADO DESHABILITADO PARA EL BOTÓN DE CANJE */
        .btn-redeem:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(100%);
        }
    </style>
</head>
<body>

    <!-- ==========================================================================
       2. TU ESTRUCTURA HTML (Las Pantallas)
       ========================================================================== -->
    
    <!-- PANTALLA 1: BIENVENIDA -->
    <div id="screen-welcome" class="screen">
        <!-- Tus textos, logo de Foggato y botones de inicio -->
        <button onclick="initApp('cliente')">Entrar como Cliente</button>
        <button onclick="initApp('demo')" class="btn-secondary">Entrar Modo Demo</button>
    </div>

    <!-- PANTALLA 2: HOME (TARJETA DE CLIENTE) -->
    <div id="screen-home" class="screen" style="display:none;">
        <!-- Cabecera con saludo al cliente -->
        <div class="user-profile">...</div>

        <!-- CONTENEDOR DE SELLOS (Se llenará dinámicamente con JS) -->
        <div id="stamps-grid" class="stamps-grid">
            <!-- El JS meterá los 10 sellos aquí manteniendo tus clases visuales -->
        </div>

        <!-- 💡 MEJORA: El botón de canje ahora tiene la ID para controlarlo con JS -->
        <button id="btn-redeem-action" class="btn-redeem" onclick="triggerRedeem()">
            Canjear Recompensa
        </button>
    </div>

    <!-- PANTALLA 3: CÁMARA / QR (Para acumular) -->
    <div id="screen-qr" class="screen" style="display:none;">
        <!-- Tu interfaz de escaneo o el QR generado para la caja -->
    </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <nav class="bottom-nav" style="display:none;">
        <button onclick="switchScreen('home')">Inicio</button>
        <button onclick="switchScreen('qr')">Acumular</button>
        <!-- 💡 MEJORA: El botón Demo sólo aparece si se inició en modo demo -->
        <button id="nav-demo-hook" onclick="addDemoStamp()" style="display:none;">+ Sello Demo</button>
    </nav>


    <!-- ==========================================================================
       3. EL MOTOR LÓGICO (JavaScript Unificado)
       ========================================================================== -->
    <script>
        // CONFIGURACIÓN GLOBAL
        const TOTAL_STAMPS = 10;
        
        // ESTADO DE LA APP (El "cerebro" que controla todo)
        let appState = {
            isDemoMode: false,
            currentStamps: 0,
            currentScreen: 'welcome'
        };

        // 1. CONTROL DE NAVEGACIÓN
        function switchScreen(screenId) {
            // Oculta todas las pantallas
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            // Muestra la seleccionada
            document.getElementById(`screen-${screenId}`).style.display = 'block';
            appState.currentScreen = screenId;
        }

        // 2. INICIALIZACIÓN DE LA APP
        function initApp(mode) {
            appState.isDemoMode = (mode === 'demo');
            appState.currentStamps = 0; // Inicia limpia

            // Control visual del botón demo en el menú inferior
            const demoBtn = document.getElementById('nav-demo-hook');
            demoBtn.style.display = appState.isDemoMode ? 'block' : 'none';

            // Mostrar el menú de navegación general
            document.querySelector('.bottom-nav').style.display = 'flex';

            // Renderizar la tarjeta por primera vez y saltar al home
            renderCard();
            switchScreen('home');
        }

        // 3. RENDERIZADO DINÁMICO (Aquí ocurre la magia visual)
        function renderCard() {
            const grid = document.getElementById('stamps-grid');
            grid.innerHTML = ''; // Limpiamos la rejilla vieja

            for (let i = 1; i <= TOTAL_STAMPS; i++) {
                const stamp = document.createElement('div');
                
                // Asignamos la clase base de tus sellos
                stamp.classList.add('stamp');

                // Aplicamos tus estilos especiales de iconos CSS para los hitos 5 y 10
                if (i === 5) stamp.classList.add('special-5');
                if (i === 10) stamp.classList.add('special-10');

                // Si el cliente ya se ganó este sello, le clavamos la clase 'active'
                if (i <= appState.currentStamps) {
                    stamp.classList.add('active');
                }

                grid.appendChild(stamp);
            }

            // ACTUADORES: Bloqueo/Desbloqueo del botón de canje
            const redeemBtn = document.getElementById('btn-redeem-action');
            if (appState.currentStamps === TOTAL_STAMPS) {
                redeemBtn.disabled = false;
                redeemBtn.innerText = "¡Recompensa Lista! Canjear";
            } else {
                redeemBtn.disabled = true;
                redeemBtn.innerText = `Faltan ${TOTAL_STAMPS - appState.currentStamps} cafés para tu Affogato`;
            }
        }

        // 4. ACCIONES (Sumar y Canjear)
        function addDemoStamp() {
            if (appState.currentStamps < TOTAL_STAMPS) {
                appState.currentStamps++;
                renderCard(); // Redibujamos los sellos activos
                
                if(appState.currentStamps === TOTAL_STAMPS) {
                    alert("¡Felicidades! Completaste tu tarjeta. Ya puedes disfrutar tu Affogato de cortesía.");
                }
            }
        }

        function triggerRedeem() {
            if (appState.currentStamps === TOTAL_STAMPS) {
                // Aquí metes la animación de éxito que hiciste o el modal de confirmación
                alert("¡Disfruta tu Affogato rústico en Foggato Café! Reiniciando tarjeta...");
                
                // Al confirmar, reiniciamos el contador a 0
                appState.currentStamps = 0;
                renderCard();
            }
        }
    </script>
</body>
</html>
