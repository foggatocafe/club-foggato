<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Foggato - Tarjeta de Lealtad</title>
    <!-- Iconos de FontAwesome para las tazas y estrellas -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* DISEÑO RÚSTICO Y ELEGANTE PARA FOGGATO CAFÉ */
        body {
            background-color: #121212;
            color: #f5f2eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-container {
            background-color: #1a1a1a;
            border: 2px solid #8B5A2B; /* Tono café bronce */
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }

        .card-header {
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .brand-title {
            color: #D4AF37; /* Dorado elegante */
            font-size: 24px;
            letter-spacing: 2px;
            margin: 0 0 5px 0;
        }

        .brand-subtitle {
            color: #a09884;
            font-size: 14px;
            margin: 0;
            text-transform: uppercase;
        }

        .status-box {
            background-color: #262626;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #3d3d3d;
        }

        .status-box p {
            margin: 5px 0;
            font-size: 16px;
        }

        #stamp-count {
            color: #D4AF37;
            font-weight: bold;
            font-size: 20px;
        }

        .reward-alert {
            color: #8B5A2B;
            font-size: 13px;
            font-style: italic;
        }

        /* CUADRÍCULA DE SELLOS */
        .stamps-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .stamp-slot {
            background-color: #262626;
            border: 2px dashed #444;
            border-radius: 50%;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.3s ease;
        }

        /* Sello cuando ya está activo (Café con logo dorado) */
        .stamp-slot.active {
            background-color: #8B5A2B;
            border-style: solid;
            border-color: #D4AF37;
            box-shadow: 0 0 10px rgba(212,175,55,0.3);
        }

        .stamp-slot i {
            color: #444;
            font-size: 18px;
        }

        .stamp-slot.active i {
            color: #D4AF37;
            animation: popIn 0.3s ease;
        }

        /* El premio final (Espacio 10) */
        .stamp-slot.reward-slot {
            border-color: #D4AF37;
        }
        
        .stamp-slot.reward-slot i {
            color: #554422;
        }

        .stamp-slot.reward-slot.active i {
            color: #fff;
            animation: pulse 1.5s infinite;
        }

        .card-footer {
            border-top: 1px solid #333;
            padding-top: 15px;
            font-size: 12px;
            color: #a09884;
        }

        .card-footer p {
            margin: 6px 0;
        }

        /* BOTONES */
        .btn-primary {
            background-color: #8B5A2B;
            color: #f5f2eb;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: #A06D3B;
        }

        .btn-secondary {
            background-color: transparent;
            color: #888;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            color: #f5f2eb;
            border-color: #666;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Encabezado de la Tarjeta -->
        <div class="card-header">
            <h1 class="brand-title">FOGGATO CAFÉ</h1>
            <p class="brand-subtitle">Club de Recompensas</p>
        </div>

        <!-- El progreso visual -->
        <div class="status-box">
            <p>Llevas <span id="stamp-count">0</span> de 10 sellos</p>
            <p id="reward-message" class="reward-alert">¡Visítanos para ganar tu primer sello!</p>
        </div>

        <!-- La cuadrícula de 10 sellos -->
        <div class="stamps-grid" id="stamps-grid">
            <!-- Se generan con JS -->
        </div>

        <!-- Info y Reglas breves -->
        <div class="card-footer">
            <p><i class="fa-solid fa-circle-info"></i> Consumo mínimo por sello: $80 MXN</p>
            <p>Válido solo en sucursal Reynosa</p>
            <button id="simulate-btn" class="btn-primary">Simular Visita (Sumar Sello)</button>
            <button id="reset-btn" class="btn-secondary">Reiniciar Tarjeta</button>
        </div>
    </div>

    <script>
        // MOTOR LÓGICO DE LA TARJETA DE LEALTAD
        const TOTAL_STAMPS = 10;
        let currentStamps = parseInt(localStorage.getItem('foggato_stamps')) || 0;

        const stampsGrid = document.getElementById('stamps-grid');
        const stampCountText = document.getElementById('stamp-count');
        const rewardMessage = document.getElementById('reward-message');
        const simulateBtn = document.getElementById('simulate-btn');
        const resetBtn = document.getElementById('reset-btn');

        // Renderizar la cuadrícula inicial
        function renderGrid() {
            stampsGrid.innerHTML = '';
            for (let i = 1; i <= TOTAL_STAMPS; i++) {
                const slot = document.createElement('div');
                slot.classList.add('stamp-slot');
                
                // Si es el último, es el espacio del premio
                if (i === TOTAL_STAMPS) {
                    slot.classList.add('reward-slot');
                }

                if (i <= currentStamps) {
                    slot.classList.add('active');
                    if (i === TOTAL_STAMPS) {
                        slot.innerHTML = '<i class="fa-solid fa-gift"></i>'; // Regalo activo
                    } else {
                        slot.innerHTML = '<i class="fa-solid fa-mug-hot"></i>'; // Taza activa
                    }
                } else {
                    if (i === TOTAL_STAMPS) {
                        slot.innerHTML = '<i class="fa-solid fa-star"></i>'; // Estrella de premio inactiva
                    } else {
                        slot.innerHTML = `<i class="fa-solid fa-circle" style="font-size: 8px; opacity: 0.2;"></i>`;
                    }
                }
                stampsGrid.appendChild(slot);
            }
            
            // Actualizar textos
            stampCountText.innerText = currentStamps;
            
            if (currentStamps === 0) {
                rewardMessage.innerText = "¡Visítanos para ganar tu primer sello!";
                rewardMessage.style.color = "#a09884";
            } else if (currentStamps < TOTAL_STAMPS) {
                rewardMessage.innerText = `¡Te faltan ${TOTAL_STAMPS - currentStamps} tazas para tu bebida gratis!`;
                rewardMessage.style.color = "#D4AF37";
            } else {
                rewardMessage.innerText = "¡Felicidades! Tienes un Affogato o Crepa GRATIS 🎉";
                rewardMessage.style.color = "#4CAF50";
            }
        }

        // Botón de Sumar Sello
        simulateBtn.addEventListener('click', () => {
            if (currentStamps < TOTAL_STAMPS) {
                currentStamps++;
                localStorage.setItem('foggato_stamps', currentStamps);
                renderGrid();
            } else {
                alert("¡Ya completaste tu tarjeta! Canjea tu premio y reiníciala.");
            }
        });

        // Botón de Reiniciar
        resetBtn.addEventListener('click', () => {
            if (confirm("¿Quieres limpiar la tarjeta y empezar de nuevo?")) {
                currentStamps = 0;
                localStorage.setItem('foggato_stamps', currentStamps);
                renderGrid();
            }
        });

        // Carga inicial
        renderGrid();
    </script>
</body>
</html>
